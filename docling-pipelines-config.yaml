assets_management:
  flow_repository:
    type: local
    config:
      # Set this to the directory where your flow definitions are stored (flow repository).
      base_dir: sample_flows

  documentset_repository:
    type: duckdb
    config:
      # Database path for DuckDB storage
      database_path: data/duckdb/document_sets.duckdb

  documentlibrary_repository:
    type: duckdb
    config:
      # Database path for DuckDB storage
      database_path: data/duckdb/document_sets.duckdb

  # To keep document set / document library metadata in PostgreSQL (needed when
  # running more than one API replica or worker against the same assets),
  # replace the two blocks above with the following. Any connection key left out
  # falls back to DOCPIPE_POSTGRES_HOST/PORT/DB/USER/PASSWORD; the password is
  # required (YAML or DOCPIPE_POSTGRES_PASSWORD). Tables are created on first use
  # in the given schema. The document set data tables themselves still live in
  # DuckDB at database_path (operator option data_backend).
  # Env overrides: DOCUMENTSET_REPOSITORY_TYPE=postgres, DOCUMENTLIBRARY_REPOSITORY_TYPE=postgres
#  documentset_repository:
#    type: postgres
#    config:
#      database_path: data/duckdb/document_sets.duckdb  # data tables (DuckDB)
#      postgres:
#        host: localhost
#        port: 5432
#        database: docpipe
#        user: docpipe_user
#        # password: set DOCPIPE_POSTGRES_PASSWORD instead of committing it here
#        schema: docpipe_assets
#        pool_size: 5
#        max_overflow: 10
#        pool_timeout: 30
#
#  documentlibrary_repository:
#    type: postgres
#    config:
#      postgres:
#        host: localhost
#        port: 5432
#        database: docpipe
#        user: docpipe_user
#        schema: docpipe_assets

projects_management:
  project_repository:
    type: local
    config:
      # Set this to the directory where project definitions are stored.
      # Defaults to ~/Documents/pipeline/projects if not specified.
      base_dir: sample_projects

job_management:
  framework:
    type: default
    config: {}
  store:
    # Storage backend options: inmemory, json, duckdb, postgresql
    # Current active: json (file-based storage)
    type: filesystem
    config:
      base_dir: ./data/job_stats_store_data


job_run_report:
  storage:
    # Report storage backend options: filesystem
    # filesystem stores reports at data/{job_id}/{job_run_id}/job_report_{job_run_id}.csv
    type: filesystem
    config: {}

incremental_metadata:
  storage:
    type: "filesystem"
    config:
      base_dir: "./data"
      lock_timeout: 30.0

flow_definition_snapshot:
  storage:
    type: "filesystem"
    config:
      base_dir: "./data"
      lock_timeout: 30.0

# Secret provider configuration.
# Enable Vault to allow flow configs to use vault:// references for secrets.
# Credentials (VAULT_ROLE_ID, VAULT_SECRET_ID) must be set as environment variables.
# See src/docpipe/integrations/secrets/hashicorp_vault.py for all supported env vars.
secrets:
  vault:
    enabled: false          # Set to true to enable HashiCorp Vault integration
    provider: hashicorp     # Provider name used in vault:// URIs

#
#    # To use DuckDB (embedded database, no server required), uncomment below:
#    type: duckdb
#    config:
#      database_path: ./data/duckdb/job_stats.duckdb

    # To use PostgreSQL (requires running PostgreSQL server), uncomment below:
