default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
        exclude: >-
          (?x)^(
            frontend/tsconfig\.json|
            frontend/tsconfig\.server\.json|
            frontend/public/manifest\.json
          )$
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=3000]
        exclude: ^tests/fixtures/
      - id: check-case-conflict
      - id: mixed-line-ending

  # Strip Jupyter notebook outputs before other checks
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        files: \.ipynb$

  # License header enforcement
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: insert-license
        name: "Insert license header"
        args:
          - --license-filepath=.github/license-header.txt
          - --comment-style=#
          - --detect-license-in-X-top-lines=5
        files: '^(src|tests)/.*\.py$'

  # Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-format
        files: ^.*\.py$
      - id: ruff
        args: [--fix]
        files: ^.*\.py$

  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-ruff-check
        additional_dependencies: [ruff==0.15.20]
        args: ["--nbqa-dont-skip-bad-cells"]
        files: \.ipynb$

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: [--configfile=pyproject.toml]
        files: ^src/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --config-file=pyproject.toml, --python-version=3.12]
        additional_dependencies: [types-requests, types-cachetools, pydantic]
        files: ^(src|tests)/.*\.py$

  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: [--fail-under=90, --ignore-init-method, --ignore-magic, --ignore-private, -e, tests, -e, scripts]
        files: ^src/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
