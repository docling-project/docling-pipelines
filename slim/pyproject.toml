    "pytest-mock==3.15.1",
    "pytest-timeout==2.3.1",
    "pytest-xdist==3.8.0",
    "ruff==0.15.20",
]

notebooks = [
    "ipykernel==7.3.0",
    "jupyter==1.1.1",
    # CVE-2026-102831, CVE-2026-102904, CVE-2026-102830: fixed in JupyterLab 4.6.4.
    "jupyterlab==4.6.4",
    "matplotlib==3.11.0",
    "nbconvert==7.17.2",
    "nbformat==5.10.4",
    "seaborn==0.13.2",
]

telemetry = [
    "opentelemetry-api==1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-sdk==1.45.1",
]

extract = [
    "accelerate==1.15.0",
    "docling[rapidocr]==2.142.1",
    "sentence-transformers==6.1.0",
    "transformers>=5.17.0,<5.18.0",
]

easyocr = [
    "docling[easyocr]==2.142.1",
]

ocrmac = [
    "docling[ocrmac]==2.142.1",
]

tesserocr = [
    "docling[tesserocr]==2.142.1",
]

vlm_asr = [
    "docling[vlm,asr]==2.142.1",
]

[project.urls]
Homepage = "https://github.com/docling-project/docling-pipelines"
Documentation = "https://github.com/docling-project/docling-pipelines/blob/main/docs/README.md"
Source = "https://github.com/docling-project/docling-pipelines"
"Bug Tracker" = "https://github.com/docling-project/docling-pipelines/issues"

[project.scripts]
docling-pipelines-api = "docpipe.api.main:run"
docling-pipelines = "docpipe.cli.docpipe_cli:main"

[tool.hatch.build.targets.wheel.force-include]
"../src/docpipe" = "docpipe"

[tool.hatch.build.targets.sdist.force-include]
"../src/docpipe" = "docpipe"

[tool.hatch.build]
directory = "dist"
exclude = [
    ".venv/**",
    ".vtest/**",
    "**/__pycache__/**",
    "**/*.pyc",
]

[tool.hatch.build.targets.sdist]
exclude = [
    ".venv/",
    ".vtest/",
    "*.pyc",
    "__pycache__/"
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = ".."

[tool.uv]
override-dependencies = [
    # Dependabot: bump oauthlib to 4.0.0 (transitive via requests-oauthlib).
    "oauthlib==4.0.0",
    # Dependabot: anyio < 4.14.2 — TLS spoofing (critical), process group leak (high), stderr deadlock (medium).
    "anyio>=4.14.2",
    # CVE-2026-59939: Security fix for httplib2 vulnerability (transitive via google-auth-httplib2).
    "httplib2>=0.32.0",
    # Dependabot: h2 <= 4.4.0 — duplicate Host header request smuggling (transitive via httpx).
    "h2==4.4.1",
    # Pin rapidocr to 3.9.0 within docling-slim's >=3.8,<4.0 constraint.
    "rapidocr==3.9.0",
    # CVE-2026-49476, CVE-2026-49477: Security fix for soupsieve vulnerability (transitive via beautifulsoup4).
    "soupsieve>=2.8.4",
    # CVE-2026-85670: tokenizers <= 0.23.2 vulnerable (CVSS 6.5); fix is 0.23.3+ (transitive via sentence-transformers/transformers).
    "tokenizers>=0.23.3",
]

[tool.ruff]
# Set the maximum line length to 120 characters
line-length = 120
# Target Python 3.12
target-version = "py312"

[tool.ruff.lint]
# Enable pycodestyle (E, W), Pyflakes (F), isort (I), and other useful rules
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
    "RET",   # flake8-return
    "PTH",   # flake8-use-pathlib (issue #6399)
    "DTZ",   # flake8-datetimez — require timezone-aware datetimes (issue #6401)
    "T10",   # flake8-debugger
    "EM",    # flake8-errmsg
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
]
# Ignore specific rules if needed
ignore = [
    "UP035",  # Import from `collections.abc` instead of `typing` (keep typing imports)
    "E501",   # Line too long (let formatter handle line length)
    "SIM",    # flake8-simplify - ignore all simplification suggestions (nested structures, etc.)
    "N818",   # Exception name should end with Error suffix
    "B027",   # Empty method in abstract base class without abstract decorator (intentional for optional overrides)
    "EM",     # flake8-errmsg
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PT003", "PT006", "PT009", "PT011", "PT012", "PT013", "PT018", "PT027", "PT028"]
"tests/*.py" = ["PT003", "PT006", "PT009", "PT011", "PT012", "PT013", "PT018", "PT027", "PT028"]

[tool.ruff.lint.isort]
# Configure import sorting
# NOTE: Ruff's isort implementation is the single source of truth for import sorting.
# No conflicting isort configurations exist in .isort.cfg or setup.cfg files.
known-first-party = ["docpipe"]

[tool.ruff.format]
# Quote style standardization: Converting all string quotes to double quotes for consistency
# This will automatically convert single quotes to double quotes throughout the codebase
# Note: Raw strings (r"..."), f-strings (f"..."), and docstrings are handled correctly
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Respect magic trailing commas
skip-magic-trailing-comma = false

[tool.mypy]
mypy_path = "."
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
# Treat the backend directory as the source root
files = ["."]
# Set Python version to 3.12 to support PEP 695 type parameter syntax
python_version = "3.12"
# Disable import-untyped errors for third-party libraries without type stubs
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "pyarrow",
    "pyarrow.*",
    "data_processing",
    "data_processing.*",
    "nltk",
    "nltk.*",
    "fasttext",
    "fasttext.*",
    "langdetect",
    "langdetect.*",
    "dpk_enrichment",
    "dpk_enrichment.*",
    "dpk_doc_quality",
    "dpk_doc_quality.*",
    "dpk_readability",
    "dpk_readability.*",
    "dpk_ededup",
    "dpk_ededup.*",
    "dpk_doc_id",
    "dpk_doc_id.*",
    "msal",
    "msal.*",
    "psutil",
    "psutil.*",
    "cachetools",
    "cachetools.*",
    "google_auth_oauthlib",
    "google_auth_oauthlib.*",
    "babel",
    "babel.*",
    "babel.core",
    "babel.numbers",
    "datefinder",
    "datefinder.*",
    "re2",
    "re2.*",
    "opentelemetry",
    "opentelemetry.*",
    "mcp",
    "mcp.*"
]
ignore_missing_imports = true
follow_imports = "silent"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = ["B101"]  # Allow assert statements in tests

[tool.coverage.run]
source = ["src/docpipe"]
omit = [
    "tests/*",
    "**/__pycache__/*",
    "src/docpipe/integrations/*",  # External integrations — covered by integration tests
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "types-boto3==1.43.119",
    "types-python-dateutil==2.9.0.20260807",
    "types-requests==2.33.0.20260408",
]
