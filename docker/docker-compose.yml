services:
  docpipe:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        COMPUTE_BACKEND: cpu
    ports:
      - "8080:8080"
    environment:
      BFF_URL: http://bff:3001
      DOCPIPE_DATA_PATH: /data
      FLOW_REPOSITORY_BASE_DIR: /data/flows
      PROJECT_REPOSITORY_BASE_DIR: /data/projects
      HF_HOME: /data/models/huggingface
      OLLAMA_HOST: http://ollama:11434
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:?Set OPENSEARCH_PASSWORD}
      # Authentication is on by default. Set DOCPIPE_AUTH_ENABLED=false only for a local, trusted setup.
      DOCPIPE_AUTH_ENABLED: ${DOCPIPE_AUTH_ENABLED:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY to at least 32 random characters}
      # Optional break-glass administrator. Supply a bcrypt hash; no default is shipped.
      DOCPIPE_AUTH_BOOTSTRAP_USERNAME: ${DOCPIPE_AUTH_BOOTSTRAP_USERNAME:-}
      DOCPIPE_AUTH_BOOTSTRAP_PASSWORD_HASH: ${DOCPIPE_AUTH_BOOTSTRAP_PASSWORD_HASH:-}
    volumes:
      - docpipe-data:/data
      - ../tests/fixtures/invoices:/documents:ro
      - ../sample_documents:/opt/app-root/src/sample_documents:ro
    depends_on:
      bff:
        condition: service_healthy
      ollama:
        condition: service_started
      opensearch:
        condition: service_healthy

  bff:
    build:
      context: ..
      dockerfile: docker/bff.Dockerfile
    environment:
      BACKEND_API_URL: http://docpipe:8080

  ollama:
    image: ollama/ollama:0.34.1
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    environment:
      discovery.type: single-node
      plugins.security.ssl.http.enabled: "false"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:?Set OPENSEARCH_PASSWORD}
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error -u \"admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD\" --output /dev/null http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  docpipe-data:
  ollama-data:
  opensearch-data:
