services:
  docpipe:
    build:
      context: ../..
      dockerfile: docker/event-streaming/Dockerfile
      args:
        COMPUTE_BACKEND: cpu
    ports:
      - "8080:8080"
    environment:
      DOCPIPE_DATA_PATH: /data
      FLOW_REPOSITORY_BASE_DIR: /data/flows
      HF_HOME: /data/models/huggingface
      OLLAMA_HOST: http://ollama:11434
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:?Set OPENSEARCH_PASSWORD}
      DOCPIPE_EVENT_STREAMING_ENABLED: ${DOCPIPE_EVENT_STREAMING_ENABLED:?Set DOCPIPE_EVENT_STREAMING_ENABLED}
      DOCPIPE_API_BASE_URL: ${DOCPIPE_API_BASE_URL:-http://127.0.0.1:8080}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_INPUT_TOPIC: ${KAFKA_INPUT_TOPIC:?Set KAFKA_INPUT_TOPIC}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:?Set KAFKA_GROUP_ID}
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    volumes:
      - docpipe-data:/data
      - ../../tests/fixtures/invoices:/documents:ro
    depends_on:
      ollama:
        condition: service_started
      opensearch:
        condition: service_healthy
      register-schema:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:0.34.1
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    environment:
      discovery.type: single-node
      plugins.security.ssl.http.enabled: "false"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:?Set OPENSEARCH_PASSWORD}
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error -u \"admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD\" --output /dev/null http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:29092"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_INPUT_TOPIC: ${KAFKA_INPUT_TOPIC:?Set KAFKA_INPUT_TOPIC}
    volumes:
      - ./scripts/kafka-init.sh:/kafka-init.sh:ro
    entrypoint: ["/bin/sh", "/kafka-init.sh"]
    depends_on:
      kafka:
        condition: service_healthy

  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.4
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://localhost:8081/subjects"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy

  register-schema:
    image: python:3.12-slim
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    volumes:
      - ./schemas:/app/schemas:ro
      - ./helpers/register_schema.py:/app/register_schema.py:ro
    command:
      - python
      - /app/register_schema.py
      - ${KAFKA_INPUT_TOPIC:?Set KAFKA_INPUT_TOPIC}
      - /app/schemas/event_schema.json
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy

volumes:
  docpipe-data:
  ollama-data:
  opensearch-data:
  kafka-data:
